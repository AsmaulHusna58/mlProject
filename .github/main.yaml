name: workflow 

on: 
push :
branches:
- main 
paths-ignore:
- 'README.md'

permission:
id-token: write 
contents : read 

jobs:
integration:
name: Continuous Integration 
runs-on : ubuntu-latest 
steps:
- name : Checkout Code 
uses : actions/checkout@v3 

-name: Lint code 
run : echo "Linting repository" 
-name : Run unit tests 
run: echo "Running unit tests"

build-and-push-ecr-image:
name : Continuous Devivery 
needs: integration 
runs-on: ubuntu-latest 
steps : 
-name: Checkout code 
uses : actions/checkout@v3 

-name : Install Utilities 
run : 
sudo apt-get update 
sudo apt-get install -y jq unzip 
- name : Configure AWS credentials 
uses : aws-actions/Configure-aws-credentials@v1 
with : 
aws-access-key-id : ${{scerets.AWS_ACCESS_KEY_ID}}
aws-secret-access-key : ${{secrets.AWS_SECRET_ACCESS_KEY}}
aws-region : $ {{secret.AWS_REGION}} 

-name : Login to Amazon ECR 
id : login-ecr 
uses : aws-actions/amazon-ecr-login@v1 
-name : Build , tag, and push image to Amazon ECR 
id : build-image 
evn : 
ECR_REGISTRY : ${{steps.login-ecr.outputs.registry}}
ECR_REPROSITORY : ${{secrets.ECR_REPOSITORY_NAME}}
IMAGE_TAG : latest 
run : 
# Build a docker container and 
# push it ot ECR so that it can 
# be deployed to ECR 
docker build -t $ECR_REGISTRY/$ECR_REGISTRY:$IMAGE_TAG . 
docker push $ ECR_REGISTRY/$ECR_REGISTRY: $IMAGE_TAG 
echo "::set-output name=image::$ECR_REGISTRY/$ECR_REGISTRY:$IMAGE_TAG"

Continuous-Deployment:
needs : build-and-push-ecr-image 
reuns-on : self-hosted 
steps: 
-name : Checkout 
uses : actions/checkout@v3 

-name : Configure AWS credentials
uses : aws-actions/Configure-aws-credentials@v1 
with :
aws-access-key-id : ${{scerets.AWS_ACCESS_KEY_ID}}
aws-secret-access-key : ${{secrets.AWS_SECRET_ACCESS_KEY}}
aws-region : $ {{secret.AWS_REGION}}

-name : Login to Amazon ECR 
id : login-ecr 
uses : aws-actions/amazon-ecr-login@v1

-name : Pull latest images 
run : 
docker pull ${{secrets.AWS_ECR_LOGIN-uri}}/${{secrets.ECR_REGISTRY_NAME}}:latest

# name: stop and remove continer if running 
# run : 
# docker ps -q --filter "name-mltest" | grep -q . && docker stop mltest && docker rm -fv

-name Run Docker Image to serve users 
run :
docker run -d -p 8080:8080 --ipc="host" --name=mltest =e 'scerets.AWS_ACCESS_KEY_ID=${{secrets.AWS_SECRET_ACCESS_KEY}}'
-name : Clean previous images and continers 
run : 
docker system prune -f 